name: Forge Test

# Runs the full contract test suite (minus the mainnet-fork tests, which
# require a live RPC) on every PR and push touching `packages/contracts/**`.
# Fuzz runs are bumped above the default 256 to catch arithmetic edge cases
# the unit tests won't hit on their own.

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/forge-test.yml"
  push:
    branches: [master]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/forge-test.yml"

concurrency:
  group: forge-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Forge Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        # Pinned to commit SHA to prevent supply-chain attacks via tag force-push.
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: v1.5.1

      - name: Show forge version
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Test (with deep fuzzing)
        run: forge test --no-match-path 'test/mainnet-fork/*' --fuzz-runs 1000 -vv

      - name: Check ABI freshness
        # packages/contracts/package.json publishes abi/*.json as export entry
        # points, but regenerating them is a manual step — they went three
        # releases stale once already (eight functions and two events missing)
        # and nothing caught it. This recompiles src/ and fails if the committed
        # ABIs differ. export-abi.sh shells out to node, which is preinstalled
        # on ubuntu-latest.
        #
        # Invoked via `bash` rather than `./…` on purpose: this repo is authored
        # on Windows with core.filemode=false, so shell scripts land in the index
        # as mode 100644 and `./script/...` would be "Permission denied" here.
        run: bash ./script/check-abi-drift.sh
